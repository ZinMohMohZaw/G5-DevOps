services:
  # Application container
  app:
    container_name: world-population-app
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  # MySQL Database container
  db:
    container_name: world-population-db
    build: db/.
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10